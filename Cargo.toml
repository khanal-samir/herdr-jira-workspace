[package]
name = "herdr-jira-workspace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Jira Kanban, calendar worklogs, comments and attachments inside Herdr"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
